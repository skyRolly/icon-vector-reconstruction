# The regression gate, run in a clean environment against the documented
# dependencies.  It exists because the gate previously aborted when `resvg_py`
# was missing while nothing guaranteed the dependency was ever installed: a
# regression gate that cannot execute under its own documented requirements is
# not a gate.  This installs exactly what README.md's "Reproducing" section
# names -- numpy, Pillow and resvg-py, pinned in requirements.txt -- and nothing else, so the
# "shipped tools import only documented dependencies" check is also a live
# statement about this environment rather than a claim about a developer's.
#
# Chromium is deliberately NOT installed.  Cross-engine validation is a
# cross-check, not the acceptance renderer, and `tools/validate.py`
# distinguishes three outcomes rather than two: exit 0 for a genuine skip (no
# browser anywhere, or --no-chromium), exit 2 when a browser WAS found and
# failed to execute, and exit 3 when one was explicitly configured and is not
# usable -- a broken configuration is not an absent optional dependency.  This
# job proves the skip path and, by pointing $ICON_CHROMIUM at nothing, the
# misconfiguration path; the steps below assert those codes, so this comment
# and the gate cannot drift apart again without the job failing.
name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the documented dependencies, pinned, and only those
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: The acceptance renderer is actually importable
        run: python -c "import resvg_py, numpy, PIL; print('resvg-py ok')"

      # SETUP, REGRESSION and VALIDATION are separate steps with separate exit
      # codes, so a failed run says which one failed.  A clean checkout carries
      # the previous release's SVG but not its render (git-ignored, derived);
      # the gate's published-sheet check needs it, and until D66 this job never
      # made it -- the gate then failed on a file that had never been
      # generated, which read as a broken release.  setup_baseline.py renders
      # ONLY the pinned SVG (manifest digest) and requires the result to be the
      # image the published sheet recorded; it exits 3 on any setup failure.
      - name: Baseline setup (exit 3 = setup failure, nothing tested)
        run: python tools/setup_baseline.py

      - name: Regression gate (exit 1 = a regression; exit 3 = setup incomplete)
        run: python -u tools/test_pipeline.py

      - name: Diagnostics run from an unrelated working directory
        run: |
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          python "$GITHUB_WORKSPACE/tools/line_report.py" shipped \
                 "$GITHUB_WORKSPACE/out/render_1024.png" | head -5

      - name: Validation without Chromium exits 0 and says it skipped
        run: |
          python tools/validate.py --no-chromium
          python - <<'PY'
          import json
          s = json.load(open("out/validation.json"))["chromium"]["status"]
          assert s.startswith("skipped"), s
          print("chromium status:", s)
          PY

      - name: A configured but unusable browser FAILS, where an absent one skips
        run: |
          set +e
          ICON_CHROMIUM=/no/such/chromium python tools/validate.py --quick > /tmp/mis.log 2>&1
          rc=$?
          set -e
          echo "exit $rc"; grep -i chromium /tmp/mis.log | head -3
          test "$rc" = "3" || { echo "expected exit 3 for a misconfigured browser"; exit 1; }
          python - <<'PY'
          import json
          c = json.load(open("out/validation.json"))["chromium"]
          assert c["status"] == "misconfigured", c
          assert c["discovery_state"] == "misconfigured", c
          assert c["executed"] is False, c
          print("misconfigured browser correctly distinguished from an absent one")
          PY

      - name: The committed parameters reproduce the committed SVG
        run: |
          python src/build_svg.py --params src/params.json --out /tmp/repro.svg
          cmp /tmp/repro.svg reconstruction.svg && echo "byte-identical"
